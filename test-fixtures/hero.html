<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hero Section</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, sans-serif; background: #faf9f6; color: #1a1a1a; }
    .hero { max-width: 960px; margin: 0 auto; padding: 80px 24px; text-align: center; }
    .hero h1 { font-size: 48px; font-weight: 800; line-height: 1.1; margin-bottom: 16px; }
    .hero p { font-size: 18px; color: #666; max-width: 540px; margin: 0 auto 32px; }
    .hero button { padding: 14px 32px; background: #2563eb; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>
  <div class="hero">
    <h1>Build beautiful products faster</h1>
    <p>The all-in-one platform for teams that ship. Design, prototype, and launch—all in one place.</p>
    <button>Get Started Free</button>
  </div>
</body>
</html>
