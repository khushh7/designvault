<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hero Section v2</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; min-height: 100vh; }
    .hero { max-width: 960px; margin: 0 auto; padding: 100px 24px; text-align: center; }
    .hero h1 { font-size: 56px; font-weight: 800; line-height: 1.05; margin-bottom: 20px; }
    .hero p { font-size: 20px; opacity: 0.85; max-width: 560px; margin: 0 auto 40px; }
    .cta-row { display: flex; gap: 12px; justify-content: center; }
    .cta-row button { padding: 14px 28px; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; border: none; }
    .cta-primary { background: white; color: #764ba2; }
    .cta-secondary { background: rgba(255,255,255,0.15); color: white; border: 1px solid rgba(255,255,255,0.3) !important; }
  </style>
</head>
<body>
  <div class="hero">
    <h1>Ship products your users love</h1>
    <p>From first sketch to final pixel. The creative platform built for modern product teams.</p>
    <div class="cta-row">
      <button class="cta-primary">Start Building</button>
      <button class="cta-secondary">Watch Demo</button>
    </div>
  </div>
</body>
</html>
