<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hero Section Final</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, sans-serif; background: #0f0f0f; color: white; min-height: 100vh; }
    .hero { max-width: 1080px; margin: 0 auto; padding: 120px 32px; }
    .badge { display: inline-block; padding: 4px 12px; background: rgba(99,102,241,0.15); color: #818cf8; border-radius: 20px; font-size: 13px; font-weight: 500; margin-bottom: 24px; }
    .hero h1 { font-size: 64px; font-weight: 800; line-height: 1.05; margin-bottom: 24px; max-width: 700px; }
    .hero h1 span { background: linear-gradient(135deg, #818cf8, #c084fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .hero p { font-size: 18px; color: #a1a1aa; max-width: 520px; margin-bottom: 40px; line-height: 1.6; }
    .cta { display: flex; gap: 12px; }
    .cta a { padding: 14px 28px; border-radius: 10px; font-size: 15px; font-weight: 600; text-decoration: none; }
    .cta-primary { background: #6366f1; color: white; }
    .cta-ghost { color: #a1a1aa; border: 1px solid #333; }
  </style>
</head>
<body>
  <div class="hero">
    <div class="badge">Now in public beta</div>
    <h1>Design tools for the <span>AI era</span></h1>
    <p>Stop switching between tabs. DesignVault gives you one place to browse, compare, and ship every design your AI tools generate.</p>
    <div class="cta">
      <a href="#" class="cta-primary">Get Started</a>
      <a href="#" class="cta-ghost">Documentation →</a>
    </div>
  </div>
</body>
</html>
